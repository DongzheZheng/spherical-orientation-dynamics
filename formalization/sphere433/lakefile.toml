name = "DFLSphere433"
version = "0.1.0"
defaultTargets = ["DFLSphere433"]

[leanOptions]
autoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
linter.style.header = false
linter.style.longLine = false
linter.style.whitespace = false
linter.style.setOption = false

[[require]]
name = "DifferentialGeometry"
git = "https://github.com/qinz1yang/differential-geometry"
rev = "7a48598d35109aa99d1cc678e2724c213cdf4ff3"

[[lean_lib]]
name = "DFLSphere433"

[[lean_lib]]
name = "continuation"
globs = ["continuation"]
